# application parameters
rag_app:
  prompt_label: staging
  llm: deepseek/deepseek-v4-flash-0731
  # llm: openai/gpt-5-mini
  # llm: gpt-5-mini
  embedding_model: text-embedding-3-large
  embedding_dimensions: 3072
  chunk_size: 270
  chunk_overlap: 30
  tokenizer_encoding: o200k_base
  collection_name: rag_demo
  search_type: similarity
  k: 3
  contextual_compression: True 
  compression_llm: openai/gpt-4o-mini
  # compression_llm: gpt-5-mini

# golden dataset
golden_dataset:
  dataset_model: deepseek/deepseek-v4-flash-0731
  max_goldens_per_context: 1
  golden_dataset_filename: golden_dataset_final
  filtration_config:
    filtration_threshold: 0.6
    max_quality_retries: 2
    filtration_critic_model: deepseek/deepseek-v4-flash-0731
  evolution_config:
    num_evolutions: 2
    evolutions:
      multicontext: 0.1
      concretizing: 0.3
      constrained: 0.4
      comparative: 0.2
  context_construction_config:
    context_critic_model: deepseek/deepseek-v4-flash-0731
    max_contexts_per_document: 1
    context_threshold: 0.7
    max_context_retries: 2
    context_chunk_size: 300
    context_chunk_overlap: 30

# evaluation dataset
evaluation_dataset:
  evaluation_dataset_filename: evaluation_dataset_final

# evaluation
evaluation:
  judge_llm: gpt-5-mini
  async_config:
    throttle_value: 3
    max_concurrent: 5
  display_config:
    results_dir: evaluation_results
    report_dir: evaluation_report